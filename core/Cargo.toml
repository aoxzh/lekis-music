[workspace]
resolver = "2"
members = [
  "crates/lekis-types",
  "crates/lekis-vfs",
  "crates/lekis-library",
  "crates/lekis-scanner",
  "crates/lekis-providers",
  "crates/lekis-enrich",
  "crates/lekis-playback",
  "crates/lekis-sync",
  "crates/lekis-plugin-host",
  "crates/lekis-core",
  "crates/lekis-ffi",
  "crates/lekis-bridge",
  "bins/lekis-node",
  "bins/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
# 许可证待定（见 REQUIREMENTS 第 5 章），确定前不要发布任何 crate。

[workspace.dependencies]
# ---- 内部 crate ----
lekis-types = { path = "crates/lekis-types" }
lekis-vfs = { path = "crates/lekis-vfs" }
lekis-library = { path = "crates/lekis-library" }
lekis-scanner = { path = "crates/lekis-scanner" }
lekis-providers = { path = "crates/lekis-providers" }
lekis-enrich = { path = "crates/lekis-enrich" }
lekis-playback = { path = "crates/lekis-playback" }
lekis-sync = { path = "crates/lekis-sync" }
lekis-plugin-host = { path = "crates/lekis-plugin-host" }
lekis-core = { path = "crates/lekis-core" }

# ---- 基础 ----
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
hex = "0.4"
httpdate = "1"
parking_lot = "0.12"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "v7", "serde"] }

# ---- 存储 ----
rusqlite = { version = "0.32", features = ["bundled"] }
ciborium = "0.2"
zstd = "0.14"

# ---- 网络 ----
# 0.12 而不是 0.13：0.13 把 rustls 特性改名（`rustls`），且默认启用 aws-lc-rs，
# 在 MSVC 之外的平台需要 NASM。0.12 的 `rustls-tls` 用 ring，跨平台构建更省事。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate"] }
quick-xml = "0.42"
mdns-sd = "0.13"
smb2 = "0.43"
nfs3_client = "0.9"
russh = { version = "0.65", default-features = false, features = ["ring"] }
russh-sftp = "3.0"

# ---- 音频 ----
symphonia = { version = "0.6", features = ["all"] }
cpal = "0.18"
rubato = "0.16"
ebur128 = "0.1"
ringbuf = "0.4"

# ---- 其他 ----
lofty = "0.25"
pinyin = "0.11"
# 繁简转换：纯 Rust 的 OpenCC 实现（Apache-2.0）。zhconv 是 GPL，不能用。
ferrous-opencc = "0.4"
notify = "8"
image = { version = "0.25", default-features = false, features = ["webp", "jpeg", "png"] }
rquickjs = "0.14"
uniffi = "0.28"
axum = "0.8"
anyhow = "1"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny" # 需要 unsafe 的 crate（FFI 绑定、音频后端）在自己的 Cargo.toml 里单独放开，并写 ADR

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"

# 日常真机测试用 release：并行编译、不做 LTO，改一行核心代码几十秒就能出包。
[profile.release]
codegen-units = 16
strip = "debuginfo"

# 上架 / 发布用：cargo build --profile dist（体积更小、更快，但编译慢很多）。
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

[profile.release-android]
inherits = "release"
opt-level = "s"

# rquickjs-sys 0.14.0 只为桌面/服务端目标预生成 bindgen 输出，没有
# aarch64-linux-android / armv7-linux-androideabi / x86_64-linux-android 的
# `src/bindings/<target>.rs`，交叉编译到 Android 会在 `include!` 处报
# "couldn't find file ... bindings/aarch64-linux-android.rs"。
# 它自带的 `bindgen` feature 需要 libclang，本机与 NDK 都没有，因此改成 vendor
# 一份：只补三个 Android 绑定文件，其余文件与 crates.io 上 0.14.0 一致，
# 桌面目标的行为完全不变。详见 core/vendor/rquickjs-sys/README.vendor.md。
[patch.crates-io]
rquickjs-sys = { path = "vendor/rquickjs-sys" }
