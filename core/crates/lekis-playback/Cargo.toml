[package]
name = "lekis-playback"
description = "Lekis 播放引擎：队列、解码、DSP、无缝播放、淡入淡出、音频输出。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lekis-types.workspace = true
# 领域 crate 之间只允许依赖 types / vfs（见 docs/ARCHITECTURE.md）：
# 播放要按 Range 从 VFS 流式读取音频，所以这里依赖 lekis-vfs 是允许的。
lekis-vfs.workspace = true
tokio.workspace = true
tracing.workspace = true
symphonia.workspace = true
cpal.workspace = true
ringbuf.workspace = true
# PLY-07：设备采样率和内容不一致时在解码线程里做重采样。
rubato.workspace = true
# VFS 的 read_range 返回 Bytes，适配器要缓存"多读出来的那部分"。
bytes.workspace = true
# PLY-08：HTTP Range 流播放。blocking 版只在专用解码线程上用（那里不能有 tokio 上下文）。
reqwest = { workspace = true, features = ["blocking"] }

# PLY-05：Windows 上的 WASAPI 独占（比特完美）输出。wasapi crate 是 MIT 许可，
# 把 IAudioClient 的 COM unsafe 都封装在里面，本 crate 仍然保持 `unsafe_code = "deny"`。
[target.'cfg(windows)'.dependencies]
wasapi = "0.27"

# 离线无缝检查（PLY-01）：用真实专辑跑 Session 的拼接路径。`test = true` 让
# `cargo test -p lekis-playback` 也跑它的指标单元测试（含 10 ms 静音负对照），不需要专辑文件。
[[example]]
name = "gapless_check"
test = true

[lints]
workspace = true
