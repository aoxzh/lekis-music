[package]
name = "lekis-vfs"
description = "虚拟文件系统：本地 / SMB / WebDAV / NFS / SFTP 的统一读取接口。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lekis-types.workspace = true
async-trait.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true

# 通用工具
futures-util.workspace = true
httpdate.workspace = true
percent-encoding.workspace = true
url.workspace = true

# WebDAV（SRC-03）
reqwest.workspace = true
quick-xml.workspace = true
# Digest 认证需要裸 MD5，workspace 里没有对应条目，只能就地带版本。
md5 = "0.8"

# SMB2/3（SRC-02）
smb2.workspace = true

# SFTP（SRC-07）
russh.workspace = true
russh-sftp.workspace = true

# NFSv3（SRC-08）。必须显式开 tokio：该 crate 默认没有任何 runtime 支持。
nfs3_client = { workspace = true, features = ["tokio"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
