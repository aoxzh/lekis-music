[package]
name = "lekis-desktop-lyrics"
description = "桌面悬浮歌词（UIX-07）：Windows Win32/DirectWrite 与 macOS AppKit 歌词面板和菜单栏歌词。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[build-dependencies]
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-numerics = "0.3"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Win32 / Direct2D 是 FFI：Windows 后端需要 unsafe。
# 与平台无关的部分（timeline / placement / model）不写 unsafe。
[lints.rust]
missing_docs = "warn"
unsafe_code = "allow"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
