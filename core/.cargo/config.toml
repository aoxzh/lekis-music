# AppKit lyrics use the Swift runtime supplied by macOS 12+. Native dependency
# build-script link arguments do not propagate to downstream Rust executables or
# test harnesses, so keep the system runpath on every macOS workspace target.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
