# cargo-deny 配置：许可证、安全公告、重复依赖检查。
# 运行：cd core && cargo deny check

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# 核心层只允许宽松许可证。GPL / AGPL 一律不允许（见 CONTRIBUTING.md 第 6 节）。
# LGPL 的 C 库（libsmb2、libnfs、FFmpeg）通过动态链接使用，不在这里列出，单独评审。
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
  # nfs3_client 是 Unlicense（公共领域），比 MIT 更宽松。
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
