[package]
name = "uniffi-bindgen"
description = "生成 Kotlin 绑定用的 uniffi-bindgen（版本和 lekis-ffi 的 uniffi 保持一致）。C# 绑定用单独安装的 uniffi-bindgen-cs。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }
