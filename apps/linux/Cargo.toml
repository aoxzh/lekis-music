[package]
name = "lekis-linux"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Lekis 音乐的 Linux 桌面前端（Rust + GTK4）"

# 独立 workspace。
# apps/linux 不并入 core/Cargo.toml 那个工作区：GTK4 只属于 Linux 前端，
# 放进 core 的工作区会让 core 的跨平台（Android / 无 GTK 的 Windows CI）编译被污染。
[workspace]

[dependencies]
# GTK4 会重导出 glib / gio / gdk / pango，所以只依赖 gtk4 一个 crate。
# v4_10 打开 FileDialog / AlertDialog 等 4.10 才有的 API。
gtk4 = { version = "0.10", features = ["v4_10"] }
# 只用来做跨线程通道（核心线程 -> GTK 主线程）。tokio 运行时由 lekis-core 自己建。
tokio = { version = "1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

lekis-core = { path = "../../core/crates/lekis-core" }
lekis-types = { path = "../../core/crates/lekis-types" }
lekis-playback = { path = "../../core/crates/lekis-playback" }

[profile.dev.package."*"]
# 依赖（gtk4-rs 的 sys crate）用优化编译：debug 下 GTK 的 FFI 层太慢，
# 而且能让 `cargo check` 之后的首次运行不至于卡几秒。
opt-level = 1

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
# 和 core 的工作区 lint 保持一致：运行时错误不允许 unwrap / expect / panic。
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
