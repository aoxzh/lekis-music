name: core

# Rust 核心：格式、静态检查、测试、文档、依赖审计。
# 只在 core/ 和 plugin-sdk/ 变动时触发；Flutter 客户端的构建见 app.yml，发布见 release.yml。

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "plugin-sdk/**"
      - ".github/workflows/core.yml"
  pull_request:
    paths:
      - "core/**"
      - "plugin-sdk/**"
      - ".github/workflows/core.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 增量编译在 CI 上没用，反而占缓存；用 sccache 更好，但先保持简单。
  CARGO_INCREMENTAL: 0

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path core/Cargo.toml --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # 核心在 Linux 上编译需要 ALSA 头文件（cpal）和 pkg-config。
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo clippy --manifest-path core/Cargo.toml --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # TEMP(debug): 把失败用例名打成 annotation，方便在 API/网页上直接看到。
      # 定位完就删掉这一段，恢复成直接 `cargo test`。
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --manifest-path core/Cargo.toml --workspace --no-fail-fast 2>&1 | tee core-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # 把失败附近的上下文（含 panic 的整段）逐行打成 annotation。
            grep -nE 'panicked at|FAILED|^failures:' core-test.log | head -10 | while IFS= read -r line; do
              n=${line%%:*}
              echo "::error::line $n: ${line#*:}"
              sed -n "$((n-25)),$((n+10))p" core-test.log | while IFS= read -r ctx; do
                echo "::error::    $ctx"
              done
            done
          fi
          exit "$status"

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      # missing_docs 是 warn 级别的 lint，这里提升成 error，保证公开 API 都有文档。
      - run: cargo doc --manifest-path core/Cargo.toml --workspace --no-deps

  deny:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: core/Cargo.toml
          command: check advisories bans licenses sources
          arguments: --all-features
