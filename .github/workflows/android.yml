name: android

# Android 客户端：先编译 Rust 核心的 .so，再编译 APK，最后检查 APK 里真的带了 native 库。

on:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "core/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "core/**"
      - "tools/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assemble debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r27
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Rust core for Android
        run: ./tools/build-android-core.sh

      - name: Generate Kotlin bindings
        run: ./tools/gen-bindings.sh

      - name: Build debug APK
        working-directory: apps/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK contains native library
        run: |
          set -euo pipefail
          apk=$(find apps/android/app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          echo "checking $apk"
          unzip -l "$apk" | grep -E 'lib/[^/]+/liblekis_ffi\.so' \
            || { echo '::error::APK 里没有 liblekis_ffi.so'; exit 1; }
          # 至少要覆盖主 ABI
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/liblekis_ffi.so' \
            || { echo '::error::缺少 arm64-v8a'; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apks
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
