name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/screenshots/**"
      - "llms.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # 下面的等待步骤要查询本次 run 的 artifacts，需要 Actions 读权限。
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/screenshots _site/assets
          cp -r website/* _site/
          # website/kit holds the full-resolution source renders; the site uses
          # the cropped, resized derivatives under website/assets/kit.
          rm -rf _site/kit
          cp docs/screenshots/*.png _site/screenshots/
          cp app/assets/brand/mark.png _site/assets/mark.png
          cp llms.txt _site/llms.txt

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # deploy-pages 在 artifact 刚上传完时偶尔会查到 0 个（Actions artifacts API
      # 最终一致，见 actions/deploy-pages#451），随后直接失败并触发失败邮件。
      # 先轮询到 github-pages 可见再部署，避开这个竞态。
      - name: Wait for the Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages" and (.expired | not))] | length')
            if [ "$count" -ge 1 ]; then
              echo "github-pages artifact visible (attempt $attempt)"
              exit 0
            fi
            echo "github-pages artifact not visible yet (attempt $attempt), retrying in 3s"
            sleep 3
          done
          echo "::error::github-pages artifact never became visible"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
