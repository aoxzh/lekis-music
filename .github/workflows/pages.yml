name: pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/screenshots/**"
      - "llms.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy-try-1.outputs.page_url || steps.deploy-try-2.outputs.page_url || steps.deploy-try-3.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site/screenshots _site/assets
          cp -r website/* _site/
          # website/kit holds the full-resolution source renders; the site uses
          # the cropped, resized derivatives under website/assets/kit.
          rm -rf _site/kit
          cp docs/screenshots/*.png _site/screenshots/
          cp app/assets/brand/mark.png _site/assets/mark.png
          cp llms.txt _site/llms.txt

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # deploy-pages 偶发在 artifact 刚上传完时查到 0 个（Actions artifacts 服务
      # 最终一致，见 actions/deploy-pages#451），随后直接失败并触发失败邮件。
      # 此时还没有创建 deployment，重试是安全的；等几秒再查基本都能命中。
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy-try-1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before retrying the Pages deployment
        if: steps.deploy-try-1.outcome == 'failure'
        run: sleep 15

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy-try-2
        if: steps.deploy-try-1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait before the last Pages deployment attempt
        if: steps.deploy-try-1.outcome == 'failure' && steps.deploy-try-2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (attempt 3)
        id: deploy-try-3
        if: steps.deploy-try-1.outcome == 'failure' && steps.deploy-try-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
