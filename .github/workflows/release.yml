name: release

# 推送 v* 标签（例如 v0.1.0-alpha.1）时：构建签名的 Android arm64-v8a APK 和 Windows x64
# 免安装 zip，然后创建 pre-release 草稿（draft），人工确认内容后再点发布。
# 版本号带 "-"（alpha / beta / rc）时标成 pre-release。
#
# Android 只编设备 ABI：不传 --target-platform 时 Flutter 会把 arm / arm64 / x64 三套 Rust
# 核心各编一遍（见 tools/dev-android.ps1），所以这里固定 android-arm64。
#
# 需要的仓库 secrets（Settings → Secrets and variables → Actions）：
#   LEKIS_KEYSTORE_BASE64    release keystore 的 base64（不带换行或带换行都行）
#   LEKIS_KEYSTORE_PASSWORD  keystore 密码
#   LEKIS_KEY_ALIAS          key 别名
#   LEKIS_KEY_PASSWORD       key 密码（PKCS12 keystore 和 keystore 密码相同；留空则用 keystore 密码）
# 标签构建缺 secrets 会直接失败，不会发布 debug 签名的 APK。
#
# 手动运行（workflow_dispatch）只构建并上传 artifacts，不创建 Release；没有 secrets 时用 debug 签名。
#
# Flutter 用 stable 通道（和 app.yml 一致）：仓库里没有版本固定文件，app/pubspec.yaml 要求 Dart ^3.14.0。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read version from pubspec and check the tag
        run: |
          set -euo pipefail
          full=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -n1)
          version=${full%%+*}
          test -n "$version" || { echo '::error::app/pubspec.yaml has no version'; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match app/pubspec.yaml version $full (expected v$version)"
              exit 1
            fi
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version $version (pre-release: $prerelease)"

  android:
    name: android apk
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LEKIS_KEYSTORE_BASE64: ${{ secrets.LEKIS_KEYSTORE_BASE64 }}
      LEKIS_KEYSTORE_PASSWORD: ${{ secrets.LEKIS_KEYSTORE_PASSWORD }}
      LEKIS_KEY_ALIAS: ${{ secrets.LEKIS_KEY_ALIAS }}
      LEKIS_KEY_PASSWORD: ${{ secrets.LEKIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          missing=''
          [ -n "$LEKIS_KEYSTORE_BASE64" ] || missing="$missing LEKIS_KEYSTORE_BASE64"
          [ -n "$LEKIS_KEYSTORE_PASSWORD" ] || missing="$missing LEKIS_KEYSTORE_PASSWORD"
          [ -n "$LEKIS_KEY_ALIAS" ] || missing="$missing LEKIS_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::tag builds need these repository secrets (Settings → Secrets and variables → Actions):$missing"
            echo '::error::without them the APK would be debug-signed, so refusing to build a release APK'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release-android

      # --target-platform android-arm64 只编 arm64-v8a 这一套 Rust 核心。
      - name: Build release APK (arm64-v8a)
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/lekis-$VERSION-android-arm64-v8a.apk"

      - name: Verify APK (Rust core present, not debug-signed)
        run: |
          set -euo pipefail
          apk=dist/lekis-$VERSION-android-arm64-v8a.apk
          echo "== $apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/liblekis_bridge\.so' \
            || { echo "::error::$apk is missing lib/arm64-v8a/liblekis_bridge.so"; exit 1; }
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)
          certs=$("$apksigner" verify --print-certs "$apk")
          grep -E 'Signer #1 certificate (DN|SHA-256)' <<<"$certs"
          # workflow_dispatch 没有 secrets 时允许 debug 签名，标签构建不允许。
          if [[ "$GITHUB_REF" == refs/tags/* ]] && grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::$apk is signed with the debug key"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: windows x64
    runs-on: windows-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Flutter 的 Windows 目标是 MSVC，Cargokit 也按 x86_64-pc-windows-msvc 编核心；
      # 运行器自带 Visual Studio 的 C++ 桌面负载，不需要本机那套 GNU dlltool 配置。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release-windows

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      # 打包和 zip 内部结构由 tools/package-windows.ps1 负责（版本号、VC++ 运行库都在脚本里）。
      - name: Package zip
        shell: pwsh
        run: ./tools/package-windows.ps1 -SkipBuild -Version "$env:VERSION"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: github release
    runs-on: ubuntu-latest
    needs: [version, android, windows]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        id: notes
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          notes="docs/release-notes-$VERSION.md"
          if [ ! -f "$notes" ]; then
            notes=dist/release-notes.md
            printf 'Lekis %s\n\nSee [CHANGELOG.md](CHANGELOG.md).\n' "$VERSION" > "$notes"
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Lekis ${{ needs.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          # 先落成草稿：检查过 APK / zip / 校验和再人工点发布。
          draft: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.zip
            dist/SHA256SUMS.txt
