name: release

# 推送 v* 标签（例如 v0.2.3）时：构建 Android arm64-v8a APK、Windows x64
# 安装器 EXE + 便携 ZIP、macOS arm64 DMG + ZIP、Linux x64 AppImage + tar.gz，
# 然后**直接发布** GitHub Release（含全部产物和校验和），无需人工再点一次发布。
# 同一个仓库同一时间只保留最新 tag 的发布会话：连续打 tag 时旧会话会被取消，
# 且旧 tag 在 publish 阶段会自行跳过，避免每个 commit 都发一条 Release 通知。
# 版本号带 "-"（beta / rc）时标成 pre-release；普通 0.x 版本按正式 Release 发布，
# 这样 GitHub 仓库首页的 Releases 区域才会显示 Latest，而不是只看到一排 tag。
# ZIP / tar.gz 是应用内更新用的可解压载荷；DMG / EXE / AppImage 是给首次安装的。
#
# Android 只编设备 ABI：不传 --target-platform 时 Flutter 会把 arm / arm64 / x64 三套 Rust
# 核心各编一遍（见 tools/dev-android.ps1），所以这里固定 android-arm64。
#
# 需要的仓库 secrets（Settings → Secrets and variables → Actions）：
#   LEKIS_KEYSTORE_BASE64    release keystore 的 base64（不带换行或带换行都行）
#   LEKIS_KEYSTORE_PASSWORD  keystore 密码
#   LEKIS_KEY_ALIAS          key 别名
#   LEKIS_KEY_PASSWORD       key 密码（PKCS12 keystore 和 keystore 密码相同；留空则用 keystore 密码）
# 标签构建缺 secrets 会直接失败，不会发布 debug 签名的 APK。
#
# 手动运行（workflow_dispatch）只构建并上传 artifacts，不创建 Release；没有 secrets 时用 debug 签名。
#
# Flutter 用 stable 通道（和 app.yml 一致）：仓库里没有版本固定文件，app/pubspec.yaml 要求 Dart ^3.14.0。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  # 所有 tag 发布共用一个组：新 tag 到达时取消旧 tag 的发布任务。
  # 本地流程几乎每个 commit 都会打一个 v0.2.x tag；旧的分组（release-${{ github.ref }}）
  # 会让每次提交都排一套 4 平台矩阵，把 runner 占满一整夜，新提交的 app/Pages CI
  # 反而一直排队。只保留最新 tag 的发布会话即可（workflow_dispatch 单独分组）。
  group: release-${{ github.ref_type }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: Read version from pubspec and check the tag
        run: |
          set -euo pipefail
          full=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | head -n1)
          version=${full%%+*}
          test -n "$version" || { echo '::error::app/pubspec.yaml has no version'; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
            if [[ "$tag" != "v$version" ]]; then
              echo "::error::tag $tag does not match app/pubspec.yaml version $full (expected v$version)"
              exit 1
            fi
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "version $version (pre-release: $prerelease)"

  android:
    name: android apk
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LEKIS_KEYSTORE_BASE64: ${{ secrets.LEKIS_KEYSTORE_BASE64 }}
      LEKIS_KEYSTORE_PASSWORD: ${{ secrets.LEKIS_KEYSTORE_PASSWORD }}
      LEKIS_KEY_ALIAS: ${{ secrets.LEKIS_KEY_ALIAS }}
      LEKIS_KEY_PASSWORD: ${{ secrets.LEKIS_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Require signing secrets for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          missing=''
          [ -n "$LEKIS_KEYSTORE_BASE64" ] || missing="$missing LEKIS_KEYSTORE_BASE64"
          [ -n "$LEKIS_KEYSTORE_PASSWORD" ] || missing="$missing LEKIS_KEYSTORE_PASSWORD"
          [ -n "$LEKIS_KEY_ALIAS" ] || missing="$missing LEKIS_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::tag builds need these repository secrets (Settings → Secrets and variables → Actions):$missing"
            echo '::error::without them the APK would be debug-signed, so refusing to build a release APK'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release-android

      - uses: gradle/actions/setup-gradle@v5

      # --target-platform android-arm64 只编 arm64-v8a 这一套 Rust 核心。
      - name: Build release APK (arm64-v8a)
        working-directory: app
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64
          mkdir -p ../dist
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/lekis-$VERSION-android-arm64.apk"

      - name: Verify APK (Rust core present, not debug-signed)
        run: |
          set -euo pipefail
          apk=dist/lekis-$VERSION-android-arm64.apk
          echo "== $apk"
          apk_files=$(unzip -Z1 "$apk")
          grep -Fxq 'lib/arm64-v8a/liblekis_bridge.so' <<<"$apk_files" \
            || { echo "::error::$apk is missing lib/arm64-v8a/liblekis_bridge.so"; exit 1; }
          apksigner=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "$certs" | grep -E 'Signer #1 certificate (DN|SHA-256)' || echo "$certs"
          # apksigner hides v1 when the manifest's minSdk >= 24; ask from 23 so a
          # missing JAR signature (OEM installers check META-INF) fails the build.
          schemes=$("$apksigner" verify --verbose --min-sdk-version 23 "$apk")
          echo "$schemes" | grep -E 'Verified using v[123] scheme' || true
          for scheme in 'v1 scheme (JAR signing)' 'v2 scheme (APK Signature Scheme v2)' 'v3 scheme (APK Signature Scheme v3)'; do
            grep -Fq "Verified using $scheme: true" <<<"$schemes" \
              || { echo "::error::$apk is missing $scheme"; exit 1; }
          done
          # workflow_dispatch 没有 secrets 时允许 debug 签名，标签构建不允许。
          if [[ "$GITHUB_REF" == refs/tags/* ]] && grep -q 'CN=Android Debug' <<<"$certs"; then
            echo "::error::$apk is signed with the debug key"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: windows x64
    runs-on: windows-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Flutter 的 Windows 目标是 MSVC，Cargokit 也按 x86_64-pc-windows-msvc 编核心；
      # 运行器自带 Visual Studio 的 C++ 桌面负载，不需要本机那套 GNU dlltool 配置。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release-windows

      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release

      # 打包和 zip 内部结构由 tools/package-windows.ps1 负责（版本号、VC++ 运行库都在脚本里）。
      - name: Package zip
        shell: pwsh
        run: ./tools/package-windows.ps1 -SkipBuild -Version "$env:VERSION"

      # Flutter 的 Windows 版不是单文件 exe（还要 flutter_windows.dll / data/ 等），
      # 所以用 Inno Setup 打一个每用户安装器；便携 zip 继续保留给应用内更新。
      - name: Build installer
        shell: pwsh
        run: |
          $release = (Resolve-Path 'app\build\windows\x64\runner\Release').Path
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            $src = Join-Path $env:SystemRoot "System32\$dll"
            if (Test-Path $src) { Copy-Item $src $release -Force }
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
            $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler (ISCC.exe) not found' }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $iscc "/DVersion=$env:VERSION" "/DLekisPayloadDir=$release" "/DLekisOutDir=$((Resolve-Path dist).Path)" 'tools\lekis-installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
          if-no-files-found: error

  macos:
    name: macos arm64
    runs-on: macos-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Require an Apple Silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64" || {
            echo '::error::macOS releases are Apple Silicon only; this runner is not arm64'
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release-macos-arm64

      # Release 构建默认是 Universal；显式开启 arm64-only，省掉 x86_64 的重复编译。
      - name: Build macOS release (arm64)
        working-directory: app
        run: |
          set -euo pipefail
          if ! flutter config --enable-macos-arm64-only; then
            echo '::warning::flutter config flag unavailable; falling back to FLUTTER_XCODE_ARCHS=arm64'
            echo 'FLUTTER_XCODE_ARCHS=arm64' >> "$GITHUB_ENV"
          fi
          flutter build macos --release

      - name: Package macOS zip and dmg
        run: |
          set -euo pipefail
          mkdir -p dist/dmg
          APP_PATH=$(ls -d app/build/macos/Build/Products/Release/*.app | head -n1)
          test -d "$APP_PATH"
          exe=$(find "$APP_PATH/Contents/MacOS" -maxdepth 1 -type f -perm -111 | head -n1)
          archs=$(lipo -archs "$exe")
          echo "app binary architectures: $archs"
          test "$archs" = "arm64" || {
            echo "::error::expected an arm64-only app, got: $archs"
            exit 1
          }
          # zip 给应用内更新（可解压替换 .app），dmg 给首次安装（拖进 Applications）。
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "dist/lekis-$VERSION-macos-arm64.zip"
          cp -R "$APP_PATH" dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Lekis $VERSION" -srcfolder dist/dmg -ov -format UDZO \
            "dist/lekis-$VERSION-macos-arm64.dmg"
          rm -rf dist/dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*macos-arm64*.zip
            dist/*macos-arm64*.dmg
          if-no-files-found: error

  linux:
    name: linux x64
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop & audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libasound2-dev \
            libx11-dev libxi-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: release-linux

      - name: Build Linux release
        working-directory: app
        run: flutter build linux --release

      - name: Package Linux tar.gz and AppImage
        run: |
          set -euo pipefail
          mkdir -p dist
          bundle=app/build/linux/x64/release/bundle
          STAGE="dist/lekis-$VERSION-linux-x64"
          rm -rf "$STAGE"
          cp -a "$bundle" "$STAGE"
          tar -C dist -czf "dist/lekis-$VERSION-linux-x64.tar.gz" "lekis-$VERSION-linux-x64"

          # AppImage：单文件、双击即用；tar.gz 仍保留给应用内更新解压替换。
          appdir="dist/lekis-$VERSION-linux-x64.AppDir"
          rm -rf "$appdir"
          mkdir -p "$appdir/usr/bin" "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/256x256/apps"
          cp -a "$bundle/." "$appdir/usr/bin/"
          cp app/assets/brand/mark.png "$appdir/lekis.png"
          cp app/assets/brand/mark.png "$appdir/usr/share/icons/hicolor/256x256/apps/lekis.png"
          cat > "$appdir/lekis.desktop" <<'EOF'
          [Desktop Entry]
          Name=Lekis Music
          Exec=lekis %U
          Icon=lekis
          Type=Application
          Categories=AudioVideo;Audio;Player;
          Terminal=false
          EOF
          cp "$appdir/lekis.desktop" "$appdir/usr/share/applications/lekis.desktop"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/lekis" "$@"
          EOF
          chmod +x "$appdir/AppRun"
          tool=$(mktemp)
          curl -fsSL -o "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$tool"
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 "$tool" "$appdir" \
            "dist/lekis-$VERSION-linux-x64.AppImage"
          rm -f "$tool"
          rm -rf "$appdir" "$STAGE"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  publish:
    name: github release
    runs-on: ubuntu-latest
    needs: [version, android, windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # 被更新 tag 取代的旧发布不再上传 Release：否则一个晚上能发出上百条
      # “新版本已发布”通知，而且这些版本一落地就已经过期了。
      - name: Skip if a newer release tag already exists
        id: newest
        run: |
          set -euo pipefail
          git fetch --tags --quiet --force
          newest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          echo "current=$GITHUB_REF_NAME newest=$newest"
          if [ "$newest" != "$GITHUB_REF_NAME" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is superseded by $newest; not publishing"
          fi

      - uses: actions/download-artifact@v8
        if: steps.newest.outputs.superseded != 'true'
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        id: notes
        if: steps.newest.outputs.superseded != 'true'
        run: |
          set -euo pipefail
          cd dist
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' ! -name 'release-notes.md' -printf '%P\n' | sort |
            while IFS= read -r file; do sha256sum "$file"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          notes="docs/release-notes-$VERSION.md"
          if [ ! -f "$notes" ]; then
            notes=dist/release-notes.md
            printf 'Lekis %s\n\nSee [CHANGELOG.md](CHANGELOG.md).\n' "$VERSION" > "$notes"
          fi
          echo "path=$notes" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        if: steps.newest.outputs.superseded != 'true'
        with:
          name: Lekis ${{ needs.version.outputs.version }}
          body_path: ${{ steps.notes.outputs.path }}
          # 直接发布，不再留成草稿：标签推送后 Release 必须立刻可见。
          draft: false
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          # 普通版本标记为 Latest；beta / rc 不抢 Latest。
          make_latest: ${{ needs.version.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/*-setup.exe
            dist/*.AppImage
            dist/SHA256SUMS.txt
