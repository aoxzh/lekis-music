name: windows

# Windows 客户端：先编译 Rust 核心的 .dll，生成 C# 绑定，再编译 WinUI 3 应用。

on:
  push:
    branches: [main]
    paths:
      - "apps/windows/**"
      - "core/**"
      - "tools/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "apps/windows/**"
      - "core/**"
      - "tools/**"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install uniffi-bindgen-cs
        run: |
          cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.9.0+v0.28.3 --locked

      - name: Build Rust core (x64)
        run: ./tools/build-windows-core.ps1 -Target x86_64-pc-windows-msvc

      - name: Generate C# bindings
        run: ./tools/gen-bindings.ps1

      - name: Build solution
        shell: pwsh
        run: |
          # .NET 10 默认生成 .slnx，老版本工具链要 .sln；两者都接受。
          $sln = Get-ChildItem apps/windows -Filter 'Lekis.Windows.sln*' | Select-Object -First 1
          if (-not $sln) { throw '找不到 apps/windows 的解决方案文件' }
          Write-Host "building $($sln.FullName)"
          dotnet build $sln.FullName -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) { throw 'dotnet build failed' }

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: apps/windows/src/Lekis.App/bin/**/*
          if-no-files-found: warn
