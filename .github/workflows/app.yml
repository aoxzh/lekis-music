name: app

# Flutter 客户端：静态分析、单元测试，以及 arm64 release APK 的构建。
# Rust 核心的 fmt/clippy/test 仍由 core.yml 负责。

on:
  push:
    branches: [main, phase-0]
    paths:
      - "app/**"
      - "core/**"
      - "design/**"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "design/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop headers for native-asset test hooks
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test --reporter expanded

  android-release:
    name: android arm64 release
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build release APK (arm64)
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify APK contains the Rust core
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          test -f "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/liblekis_bridge.so' \
            || { echo '::error::APK is missing lib/arm64-v8a/liblekis_bridge.so'; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lekis-android-arm64-release
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
